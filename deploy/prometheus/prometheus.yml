global:
  # Ten seconds, not the default fifteen: the SDK's latency histogram is
  # dense across 70-500ms, and a coarser scrape smooths out exactly the
  # movement the panels exist to show.
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: typesafe-example
    static_configs:
      - targets: ["example:2112"]
