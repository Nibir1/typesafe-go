# One workflow for everything: tests, linting, docs, drift detection, the live
# API, and releases.
#
# It was five files. They shared most of their setup, drifted apart in the
# parts they did not share — the secret scan in the drift workflow still used
# a narrow two-directory search that `make secrets` had outgrown months
# earlier — and nobody reading one of them could tell what the others did.
#
# The cost of merging is a long file. The benefit is that the whole pipeline is
# one thing you can read top to bottom, and a change to shared setup happens
# once. The `meta` job computes what kind of run this is, so every other job
# states its condition in one readable line instead of repeating an expression
# nobody checks.
name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"       # the root module
      - "*/v*"     # a submodule, e.g. typesafecache/v1.0.0
      - "*/*/v*"   # a nested one, e.g. integrations/gin/v1.0.0
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # daily — the live API still matches the contract
    - cron: "41 6 * * 1"   # Mondays — the served OpenAPI document has not moved
  workflow_dispatch:
    inputs:
      refresh_cassettes:
        description: Re-record every cassette and open a pull request
        type: boolean
        default: false
      publish_tag:
        description: "Recovery only: build and publish the release for a tag that is already pushed, e.g. v1.0.0"
        type: string
        default: ""

permissions:
  contents: read

env:
  # Nothing in CI may edit a go.mod. A build that silently adds a dependency is
  # the failure the zero-dependency guarantee exists to prevent.
  GOFLAGS: -mod=readonly
  GOLANGCI_VERSION: v2.13.2
  PYTHON_VERSION: "3.13"

jobs:
  # ---------------------------------------------------------------------------
  # What kind of run is this?
  #
  # Computed once so every job below reads as a sentence rather than as a
  # boolean expression repeated fifteen times with one of them subtly wrong.
  # ---------------------------------------------------------------------------
  meta:
    name: Classify this run
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
      tag: ${{ steps.f.outputs.tag }}
      root_tag: ${{ steps.f.outputs.root_tag }}
      pr: ${{ steps.f.outputs.pr }}
      live: ${{ steps.f.outputs.live }}
      drift: ${{ steps.f.outputs.drift }}
      refresh: ${{ steps.f.outputs.refresh }}
    steps:
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CRON: ${{ github.event.schedule }}
          REFRESH: ${{ inputs.refresh_cassettes }}
          REPO: ${{ github.repository }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          is() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          tag=false; root_tag=false
          case "$REF" in
            refs/tags/*/v*) tag=true ;;
            refs/tags/v*)   tag=true; root_tag=true ;;
          esac

          # The ordinary code gate: a branch push or a pull request, never a tag.
          code=false
          if [ "$tag" = false ] && { [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; }; then
            code=true
          fi
          # A tag also runs the gate, before anything is built or published.
          [ "$tag" = true ] && code=true

          pr=false
          [ "$EVENT" = pull_request ] && pr=true

          # Anything needing the API key only runs where the secret exists,
          # which means the upstream repository and not a fork.
          #
          # Compared case-insensitively on purpose. github.repository returns
          # the owner's canonical casing — Nibir1/typesafe-go — while the Go
          # module path is lowercase by convention. The first version of this
          # compared against the module path's spelling, so it never matched,
          # and the live and refresh jobs would have reported "skipped"
          # forever. A job that silently never runs is worse than one that
          # fails.
          own_repo=false
          [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "nibir1/typesafe-go" ] && own_repo=true

          # A recovery dispatch republishes one existing tag. It is not an
          # occasion to spend the API key or to re-check the served OpenAPI
          # document, so the scheduled work stays off.
          dispatch=false
          [ "$EVENT" = workflow_dispatch ] && [ -z "$PUBLISH_TAG" ] && dispatch=true

          live=false
          if [ "$own_repo" = true ] && { [ "$CRON" = "17 6 * * *" ] || [ "$dispatch" = true ]; }; then
            live=true
          fi

          drift=false
          if [ "$CRON" = "41 6 * * 1" ] || [ "$dispatch" = true ]; then
            drift=true
          fi

          refresh=false
          if [ "$own_repo" = true ] && [ "$dispatch" = true ] && [ "$REFRESH" = true ]; then
            refresh=true
          fi

          is code "$code"; is tag "$tag"; is root_tag "$root_tag"
          is pr "$pr"; is live "$live"; is drift "$drift"; is refresh "$refresh"

          {
            echo "| | |"; echo "|---|---|"
            echo "| event | \`$EVENT\` |"; echo "| ref | \`$REF\` |"
            echo "| code gate | \`$code\` |"; echo "| tag | \`$tag\` |"
            echo "| live API | \`$live\` |"; echo "| drift | \`$drift\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The code gate
  # ---------------------------------------------------------------------------

  # The floor and every release up to current stable. Failing here means the go
  # directive in go.mod is a promise we are not keeping.
  test:
    name: go${{ matrix.go }} / ${{ matrix.os }}
    needs: meta
    if: needs.meta.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.23", "1.24", "1.25", "1.26", "1.27"]
        include:
          # Current stable on the other platforms developers actually use. A
          # full matrix would spend most of its time re-proving that Go is
          # portable; these catch the path and filesystem assumptions that are
          # the realistic cross-platform risk.
          - os: macos-latest
            go: "1.27"
          - os: windows-latest
            go: "1.27"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - run: go version
      - run: go build ./...
      - run: go vet ./...
      - run: go vet -tags=integration ./...
      - run: go test -count=1 -timeout 300s ./...

      # The race detector is slower and needs cgo; one platform is enough to
      # catch a data race, and ubuntu is where it is cheapest.
      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 -timeout 600s ./...

  # Guards the property the whole module layout exists to protect. A dependency
  # can arrive through a transitive import nobody notices in review.
  no-dependencies:
    name: Zero third-party dependencies
    needs: meta
    if: needs.meta.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - name: Assert an empty dependency graph
        run: |
          deps=$(go list -m all | tail -n +2)
          if [ -n "$deps" ]; then
            echo "::error::The core module gained dependencies:"
            echo "$deps"
            exit 1
          fi
          echo "Dependency graph is empty, as required by P1."

      - name: Assert go.mod is tidy
        run: |
          cp go.mod /tmp/go.mod.orig
          GOFLAGS= go mod tidy
          if ! diff -u /tmp/go.mod.orig go.mod; then
            echo "::error::go.mod is not tidy — run: make tidy"
            exit 1
          fi

  format:
    name: gofmt
    needs: meta
    if: needs.meta.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Check formatting, every module
        run: |
          out=$(gofmt -l . 2>/dev/null)
          if [ -n "$out" ]; then
            echo "::error::Unformatted files — run: make fmt"
            echo "$out"
            exit 1
          fi
          echo "All files formatted."

  lint:
    name: golangci-lint (${{ matrix.module }})
    needs: meta
    if: needs.meta.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - "."
          - lint
          - typesafecache
          - typesafeotel
          - typesafeprom
          - integrations/nethttp
          - integrations/gin
          - integrations/echo
          - integrations/fiber
          - integrations/langchaingo
          - integrations/temporal
          - integrations/mcp
          - examples
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          working-directory: ${{ matrix.module }}
          # One config at the repository root governs every module, so a rule
          # cannot hold in one place and not another.
          args: --config=${{ github.workspace }}/.golangci.yml

  lint-config:
    name: Lint config is valid
    needs: meta
    if: needs.meta.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      # Installed rather than run through golangci-lint-action, because that
      # action appends `args` to `golangci-lint run` — so `config verify`
      # arrived as two path patterns for the run command and failed. Pinned to
      # the same version the lint jobs use, so the config cannot be verified
      # against a different binary than the one that enforces it.
      - name: Install golangci-lint ${{ env.GOLANGCI_VERSION }}
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}

      # A broken config silently disables a linter rather than failing.
      - name: Verify .golangci.yml
        run: golangci-lint config verify

  # Each optional module has its own go.mod, so `go test ./...` at the root does
  # not reach any of them. That is the whole point of the split.
  submodules:
    name: Submodule ${{ matrix.module }}
    needs: meta
    if: needs.meta.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [typesafecache, typesafeotel, typesafeprom, lint]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Each declares its own floor, higher than the core's wherever a
          # dependency forces it. Reading it from the module keeps this honest
          # when one moves.
          go-version-file: ${{ matrix.module }}/go.mod
      - working-directory: ${{ matrix.module }}
        run: go vet ./...
      - working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...
      - name: Assert the module is tidy
        working-directory: ${{ matrix.module }}
        run: |
          cp go.mod /tmp/go.mod.orig
          GOFLAGS= go mod tidy
          if ! diff -u /tmp/go.mod.orig go.mod; then
            echo "::error::${{ matrix.module }}/go.mod is not tidy"
            exit 1
          fi

  integrations:
    name: Integration ${{ matrix.module }}
    needs: meta
    if: needs.meta.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [nethttp, gin, echo, fiber, langchaingo, temporal, mcp]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: integrations/${{ matrix.module }}/go.mod
      - working-directory: integrations/${{ matrix.module }}
        run: go vet ./...
      - working-directory: integrations/${{ matrix.module }}
        run: go test -race -count=1 ./...
      - name: Assert the module is tidy
        working-directory: integrations/${{ matrix.module }}
        run: |
          cp go.mod /tmp/go.mod.orig
          GOFLAGS= go mod tidy
          if ! diff -u /tmp/go.mod.orig go.mod; then
            echo "::error::integrations/${{ matrix.module }}/go.mod is not tidy"
            exit 1
          fi

  # Replayed against committed cassettes: no key, no network. An example that
  # stops compiling is caught here rather than by the next person who copies it.
  examples:
    name: Examples
    needs: meta
    if: needs.meta.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: examples/go.mod
      - working-directory: examples
        run: go vet ./...
      - working-directory: examples
        run: go test -count=1 ./...

  # The only place all three optional modules are shown composed. Not tested,
  # but it must compile, or the one worked example of the full wiring rots.
  deploy-example:
    name: Deploy example builds
    needs: meta
    if: needs.meta.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: deploy/example/go.mod
      - working-directory: deploy/example
        run: go build ./... && go vet ./...

  docs:
    name: Documentation
    needs: meta
    if: needs.meta.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Every exported symbol is documented
        run: python3 scripts/check_docs.py

      # A broken cross-reference is the least visible documentation defect:
      # nothing fails, the reader just lands nowhere.
      - name: Every relative link resolves
        run: python3 scripts/check_links.py

      # A diagram that fails to parse renders as a red error box on GitHub,
      # which is worse than no diagram.
      - name: Every mermaid diagram parses
        run: python3 scripts/check_mermaid.py

      - name: Release notes exist for the current version
        run: |
          # A release whose notes are missing is a release nobody can read, and
          # the time to find that out is not while cutting it.
          ver=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' Release_Notes.md | sed 's/^## //')
          if [ -z "$ver" ]; then
            echo "::error::Release_Notes.md has no '## vX.Y.Z' section"; exit 1
          fi
          echo "Release_Notes.md describes $ver"

  licenses:
    name: Licence audit
    needs: meta
    if: needs.meta.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Reads the licence of every module the build actually compiles, and
      # fails on anything that would constrain Apache-2.0 redistribution.
      - run: python3 scripts/check_licenses.py

  dashboards:
    name: Grafana dashboards
    needs: meta
    if: needs.meta.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Validates the JSON, and that every PromQL expression names a metric
      # typesafeprom actually exports — which is what breaks silently when a
      # metric is renamed.
      - run: python3 scripts/check_dashboards.py

  secrets:
    name: No credential in any committed fixture
    needs: meta
    if: needs.meta.outputs.code == 'true' || needs.meta.outputs.drift == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # `make secrets` walks every testdata tree. The version that used to live
      # in the drift workflow searched two hard-coded directories and missed a
      # cassette stored beside the package that used it — which is exactly how
      # this fails in practice.
      - run: make secrets

  # Catches assumptions about the width of int. Token arithmetic and score
  # level indices are the realistic places for one to hide, and 32-bit targets
  # are where a Go library stops being portable without anyone noticing.
  cross-compile:
    name: Cross-compile ${{ matrix.target }}
    needs: meta
    if: needs.meta.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux/386,     goos: linux,   goarch: "386" }
          - { target: linux/arm,     goos: linux,   goarch: arm }
          - { target: windows/amd64, goos: windows, goarch: amd64 }
          - { target: darwin/arm64,  goos: darwin,  goarch: arm64 }
          - { target: js/wasm,       goos: js,      goarch: wasm }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  coverage:
    name: Coverage
    needs: meta
    if: needs.meta.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - run: go test -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./...
      - name: Report
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "Total coverage: $total"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| coverage | \`$total\` |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out

  # Every benchmark must still build. One that only runs locally stops being
  # true within a month.
  benchmarks-build:
    name: Benchmarks build
    needs: meta
    if: needs.meta.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - run: go test -run=NONE -bench=. -benchtime=1x ./...

  # Compared against the base branch on the same runner. A committed baseline
  # belongs to the machine that produced it and says nothing about a CI runner,
  # so both sides are measured here and only the ratio is used.
  benchmarks:
    name: Benchmark regression
    needs: meta
    if: needs.meta.outputs.pr == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Benchmark the base branch
        run: |
          git checkout --detach origin/${{ github.base_ref }}
          go test -run=NONE -bench=. -benchtime=200ms -count=5 ./... > /tmp/base.txt 2>&1 || true
          git checkout --detach ${{ github.sha }}

      - name: Benchmark this branch
        run: go test -run=NONE -bench=. -benchtime=200ms -count=5 ./... > /tmp/head.txt 2>&1

      - name: Compare
        run: python3 scripts/check_benchmarks.py /tmp/base.txt /tmp/head.txt --threshold 10

  # ---------------------------------------------------------------------------
  # The live API and contract drift
  #
  # A failure in these is not necessarily a bug in this repository. It means the
  # API changed, or our reading of it was wrong. Both warrant an issue.
  # ---------------------------------------------------------------------------

  live:
    name: Live API
    needs: meta
    if: needs.meta.outputs.live == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check the key is present
        id: key
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::warning::TYPESAFE_API_KEY is not set; the live suite is skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Live suite
        if: steps.key.outputs.present == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: make live

  schema-drift:
    name: Served OpenAPI vs vendored copy
    needs: meta
    if: needs.meta.outputs.drift == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Fetch the served spec
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
            https://api.typesafe.ai/openapi.json -o /tmp/served.json

      - name: Report the declared version
        run: |
          vendored=$(python3 -c 'import json;print(json.load(open("testdata/spec/openapi.json"))["info"]["version"])')
          served=$(python3 -c 'import json;print(json.load(open("/tmp/served.json"))["info"]["version"])')
          {
            echo "| | version |"; echo "|---|---|"
            echo "| vendored | \`$vendored\` |"
            echo "| served | \`$served\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diff, with key order normalised
        run: |
          norm() { python3 -c 'import json,sys;json.dump(json.load(open(sys.argv[1])),sys.stdout,indent=2,sort_keys=True)' "$1"; }
          norm testdata/spec/openapi.json > /tmp/a.json
          norm /tmp/served.json           > /tmp/b.json
          if diff -u /tmp/a.json /tmp/b.json > /tmp/spec.diff; then
            echo "No schema drift."
          else
            echo "::error::The served OpenAPI document differs from the vendored copy."
            {
              echo ""; echo "<details><summary>Schema diff</summary>"; echo ""
              echo '```diff'; head -c 60000 /tmp/spec.diff; echo '```'
              echo ""; echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            head -200 /tmp/spec.diff
            exit 1
          fi

  behavioral-drift:
    name: Live API vs golden fixtures
    needs: meta
    if: needs.meta.outputs.drift == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - name: Replay fixtures against the live API
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "TYPESAFE_API_KEY is not set; skipping behavioural drift detection." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          go test -tags=integration -count=1 -v \
            -run 'TestContractDrift|TestModelsEndpoint|TestObserveErrorEnvelopes' ./...

  # Manual, never automatic. A cassette changing is information — the model
  # moved, or the contract did — and it should be read by a person rather than
  # merged by a robot.
  refresh-cassettes:
    name: Refresh cassettes
    needs: meta
    if: needs.meta.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Re-record
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          make examples-record
          (cd internal/genexample && go test -count=1 -update ./...)
          (cd integrations/langchaingo && go test -count=1 -update ./...)

      # Before anything is committed: a key in a cassette that reaches a branch
      # is a key that has to be rotated.
      - name: Assert no credential was recorded
        run: make secrets

      - name: Replay the new cassettes
        run: |
          make examples
          go test -count=1 ./internal/genexample/
          (cd integrations/langchaingo && go test -count=1 ./...)

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No cassette changed."
            exit 0
          fi
          branch="cassettes/refresh-$(date -u +%Y%m%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Refresh cassettes against the live API"
          git push origin "$branch"
          gh pr create \
            --title "Refresh cassettes against the live API" \
            --body "Automated re-record. **Read the diff.** A changed probability means the model moved; a changed shape means the contract did." \
            --label cassettes

  # ---------------------------------------------------------------------------
  # Release
  #
  # Only on a tag, and only after the gate above has passed on that exact
  # commit. A tag is not the place to discover a failing test.
  # ---------------------------------------------------------------------------

  release-guard:
    name: Tag is releasable
    needs: [meta, test, no-dependencies, format, lint, docs, licenses]
    if: needs.meta.outputs.tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Assert nothing unpublishable is being tagged
        run: |
          # Every submodule must point at a published version, not a development
          # replace. Go ignores a replace in a dependency's go.mod, so shipping
          # one produces a module nobody can build. A root tag is allowed to
          # precede the re-pointing; a submodule tag is not.
          case "${GITHUB_REF_NAME}" in
            */v*) python3 scripts/check_release_ready.py --version "${GITHUB_REF_NAME##*/}" --allow-dirty ;;
            *)    echo "root tag; submodules are re-pointed after this publishes" ;;
          esac

      - name: Assert the tag matches the module path
        run: |
          # A v2+ tag needs a /v2 suffix on the module path, and getting that
          # wrong produces a release nobody can `go get`.
          tag="${GITHUB_REF_NAME##*/}"
          major="${tag%%.*}"
          module=$(go list -m)
          case "$major" in
            v0|v1)
              [ "$module" = "github.com/nibir1/typesafe-go" ] || {
                echo "::error::$tag needs an unsuffixed module path, got $module"; exit 1; }
              ;;
            *)
              [ "$module" = "github.com/nibir1/typesafe-go/$major" ] || {
                echo "::error::$tag needs the module path to end in /$major, got $module"; exit 1; }
              ;;
          esac

      - name: Assert the release notes exist
        if: needs.meta.outputs.root_tag == 'true'
        run: |
          ver="${GITHUB_REF_NAME}"
          if ! grep -q "^## ${ver}\$" Release_Notes.md; then
            echo "::error::Release_Notes.md has no '## ${ver}' section"
            exit 1
          fi
          echo "Release notes found for ${ver}."

  vulncheck:
    name: govulncheck (${{ matrix.module }})
    needs: meta
    if: needs.meta.outputs.tag == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - "."
          - lint
          - typesafecache
          - typesafeotel
          - typesafeprom
          - integrations/nethttp
          - integrations/gin
          - integrations/echo
          - integrations/fiber
          - integrations/langchaingo
          - integrations/temporal
          - integrations/mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Current stable, deliberately, and NOT the module's declared floor.
      #
      # govulncheck reports standard-library vulnerabilities for whichever
      # toolchain it runs under. Scanning the core with its floor of Go 1.23.0
      # reported four unpatched stdlib CVEs and failed the whole release —
      # none of them in this code, all of them fixed by using a current
      # toolchain. The floor is a compatibility promise about the API, not an
      # instruction to build with an unpatched compiler.
      #
      # What this job answers is "does this library call a known-vulnerable
      # function", and the answer must not depend on how old a toolchain the
      # module still supports. Keep a patched toolchain is documentation, not
      # a release gate.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Binaries come from the root module only. A submodule tag publishes a Go
  # module and nothing else — there is no artifact to build, sign or attest.
  publish:
    name: Build, sign and publish
    needs: [meta, release-guard, vulncheck]
    if: needs.meta.outputs.root_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # keyless signing and provenance, via OIDC
      attestations: write  # build provenance attestations
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # Verify the module cache against go.sum before anything is built.
      - run: go mod verify

      - name: Extract the release notes
        run: |
          # The body of the GitHub release is the matching section of
          # Release_Notes.md, verbatim. What is written there is what people
          # see, and it is reviewed like any other file rather than typed into
          # a web form at release time.
          awk -v ver="## ${GITHUB_REF_NAME}" '
            $0 == ver { found = 1; next }
            found && /^## v[0-9]/ { exit }
            found { print }
          ' Release_Notes.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::no notes for ${GITHUB_REF_NAME} in Release_Notes.md"; exit 1
          fi
          echo "Release body: $(wc -l < /tmp/release-notes.md) lines"
          cat /tmp/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft, for the SBOM
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keyless signing: no private key exists to be stolen. The certificate
          # records which workflow in which repository signed.
          COSIGN_EXPERIMENTAL: "1"

      # SLSA build provenance, verifiable with
      # `gh attestation verify <file> --repo nibir1/typesafe-go`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz,dist/*.zip

  # Proves each submodule tag is fetchable before anyone relies on it. Does not
  # fail the release: the proxy takes a little while to see a new tag.
  submodule-tags:
    name: Submodule tags are installable
    needs: [meta, publish]
    if: needs.meta.outputs.root_tag == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Check each submodule tag
        run: |
          tag="${GITHUB_REF_NAME}"
          for m in typesafecache typesafeotel typesafeprom lint \
                   integrations/nethttp integrations/gin integrations/echo \
                   integrations/fiber integrations/langchaingo \
                   integrations/temporal integrations/mcp; do
            path="github.com/nibir1/typesafe-go/$m@$tag"
            if GOPROXY=https://proxy.golang.org GOFLAGS= go list -m "$path" > /dev/null 2>&1; then
              echo "ok   $path"
            else
              echo "::warning::$path is not on the proxy yet"
            fi
          done

  # ---------------------------------------------------------------------------
  # Recovery: publish the release for a tag that is already pushed.
  #
  # A tag run uses the workflow file from *that tag's own commit*. When the bug
  # is in the workflow rather than in the code, re-running the tag re-runs the
  # bug, and moving the tag is not an option: the module proxy records which
  # commit a version is at the moment it first serves it, permanently, and the
  # checksum database records the hash of that tree. Re-pointing a tag makes
  # the repository and the proxy disagree forever, and anyone who already
  # fetched the version sees a checksum mismatch, which reads as a supply-chain
  # attack rather than as a mistake.
  #
  # So this path leaves the tag exactly where it is and only adds what was
  # never published: the release page, the archives, the signatures and the
  # SBOM. It runs from the default branch, so it uses the *fixed* workflow,
  # and checks out the tag's tree to build from.
  #
  # Deliberately narrow. It needs an input a human types, it refuses anything
  # that is not a root tag, and it refuses a tag that already has a release.
  # ---------------------------------------------------------------------------
  republish:
    name: Publish the release for ${{ inputs.publish_tag }}
    if: github.event_name == 'workflow_dispatch' && inputs.publish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # keyless signing and provenance, via OIDC
      attestations: write  # build provenance attestations
    env:
      # Never interpolated straight into a shell. An input is untrusted text.
      TAG: ${{ inputs.publish_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.publish_tag }}
          fetch-depth: 0

      - name: Assert this is a root tag, and that HEAD is on it
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            */v*) echo "::error::$TAG is a submodule tag; there is nothing to build"; exit 1 ;;
            *)    echo "::error::$TAG is not a version tag"; exit 1 ;;
          esac
          # goreleaser derives the version from the tag on HEAD. If the
          # checkout did not land exactly on it, stop rather than publish
          # something labelled with a version it was not built from.
          on_head=$(git tag --points-at HEAD)
          echo "$on_head" | grep -qx "$TAG" \
            || { echo "::error::HEAD is not at $TAG (tags here: $on_head)"; exit 1; }
          echo "Building $TAG at $(git rev-parse HEAD)."

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG already has a release; this job only fills in a missing one"
            exit 1
          fi
          echo "No release exists for $TAG yet."

      # The gate that failed, re-run correctly. Current stable, for the reason
      # spelled out on the vulncheck job above: the module's floor is a promise
      # about its API, not an instruction to scan with an unpatched compiler.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - run: go mod verify

      # The tag's own run passed the full gate before it failed at govulncheck,
      # but binaries should not be published on the strength of a remembered
      # green tick.
      - run: go test ./...

      - name: Extract the release notes
        run: |
          awk -v ver="## ${TAG}" '
            $0 == ver { found = 1; next }
            found && /^## v[0-9]/ { exit }
            found { print }
          ' Release_Notes.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::no notes for ${TAG} in Release_Notes.md"; exit 1
          fi
          echo "Release body: $(wc -l < /tmp/release-notes.md) lines"
          cat /tmp/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft, for the SBOM
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz,dist/*.zip
