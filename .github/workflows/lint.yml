# golangci-lint, pinned, across every module.
#
# Pinned by version rather than tracking latest: a linter that changes under
# you turns an unrelated pull request red, and the person who has to deal with
# it is never the person who upgraded it.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOLANGCI_VERSION: v2.13.2
  # Nothing in CI may edit a go.mod. A build that silently adds a dependency is
  # the failure the zero-dependency guarantee exists to prevent.
  GOFLAGS: -mod=readonly

jobs:
  golangci:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - "."
          - lint
          - typesafecache
          - typesafeotel
          - typesafeprom
          - integrations/nethttp
          - integrations/gin
          - integrations/echo
          - integrations/fiber
          - integrations/langchaingo
          - integrations/temporal
          - integrations/mcp
          - examples
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          working-directory: ${{ matrix.module }}
          # One config at the repository root governs every module, so a rule
          # cannot hold in one place and not another.
          args: --config=${{ github.workspace }}/.golangci.yml

  # The config itself must be valid. It is easy to break in a way that
  # silently disables a linter rather than failing.
  config:
    name: Lint config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          args: config verify
