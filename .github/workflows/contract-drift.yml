name: contract-drift

# Phase 0 deliverable: detect when the published wire contract moves.
#
# Two independent signals, because they fail differently:
#
#   1. The served OpenAPI document changes (schema drift) - catches contract
#      changes even when no live call is made, and needs no API key.
#   2. The live API stops matching our golden fixtures (behavioral drift) -
#      needs TYPESAFE_API_KEY, and is skipped when the secret is absent.
#
# A failure here is not a bug in this repository. It means the API changed, or
# our reading of it was wrong. Both warrant an issue.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "testdata/spec/**"
      - "testdata/contract/**"
      - "contract_test.go"
      - "contract_integration_test.go"
      - ".github/workflows/contract-drift.yml"

permissions:
  contents: read

jobs:
  schema-drift:
    name: Served OpenAPI vs vendored copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the served spec
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
            https://api.typesafe.ai/openapi.json -o /tmp/served.json

      - name: Report the declared version
        run: |
          vendored=$(python3 -c 'import json;print(json.load(open("testdata/spec/openapi.json"))["info"]["version"])')
          served=$(python3 -c 'import json;print(json.load(open("/tmp/served.json"))["info"]["version"])')
          echo "vendored info.version: $vendored"
          echo "served   info.version: $served"
          {
            echo "| | version |"
            echo "|---|---|"
            echo "| vendored | \`$vendored\` |"
            echo "| served | \`$served\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diff (key order normalized)
        run: |
          norm() { python3 -c 'import json,sys;json.dump(json.load(open(sys.argv[1])),sys.stdout,indent=2,sort_keys=True)' "$1"; }
          norm testdata/spec/openapi.json > /tmp/a.json
          norm /tmp/served.json           > /tmp/b.json
          if diff -u /tmp/a.json /tmp/b.json > /tmp/spec.diff; then
            echo "No schema drift."
          else
            echo "::error::The served OpenAPI document differs from the vendored copy."
            {
              echo ""
              echo "<details><summary>Schema diff</summary>"
              echo ""
              echo '```diff'
              head -c 60000 /tmp/spec.diff
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            head -200 /tmp/spec.diff
            exit 1
          fi

  fixtures-valid:
    name: Fixtures validate against the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install --quiet jsonschema

      - name: Validate every fixture
        run: |
          python3 - <<'EOF'
          import glob, json, sys
          from jsonschema import Draft202012Validator

          spec = json.load(open("testdata/spec/openapi.json"))
          defs = {"$defs": spec["components"]["schemas"]}

          def schema_for(name):
              s = dict(spec["components"]["schemas"][name]); s.update(defs)
              return json.loads(json.dumps(s).replace("#/components/schemas/", "#/$defs/"))

          validators = {
              ".request.json":  Draft202012Validator(schema_for("SystemOneRequest")),
              ".response.json": Draft202012Validator(schema_for("SystemOneResponse")),
          }

          failed = 0
          for path in sorted(glob.glob("testdata/contract/*.json")):
              suffix = ".request.json" if path.endswith(".request.json") else ".response.json"
              errors = sorted(validators[suffix].iter_errors(json.load(open(path))),
                              key=lambda e: list(e.path))
              if errors:
                  failed += 1
                  print(f"FAIL {path}")
                  for e in errors[:5]:
                      print(f"     {list(e.path)}: {e.message}")
              else:
                  print(f"ok   {path}")
          sys.exit(1 if failed else 0)
          EOF

  offline-contract:
    name: Offline contract suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Assert the core module has no dependencies
        run: |
          deps=$(go list -m all | tail -n +2)
          if [ -n "$deps" ]; then
            echo "::error::The core module gained dependencies:"; echo "$deps"; exit 1
          fi
          echo "Dependency graph is empty, as required by P1."

      - run: go vet ./...
      - run: go test -race -count=1 ./...

  behavioral-drift:
    name: Live API vs golden fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Replay fixtures against the live API
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "TYPESAFE_API_KEY is not set; skipping behavioral drift detection." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          go test -tags=integration -count=1 -v \
            -run 'TestContractDrift|TestModelsEndpoint|TestObserveErrorEnvelopes' ./...
