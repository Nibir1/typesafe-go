# Tag-driven release: signed binaries, an SBOM, and build provenance.
#
# Nothing here runs on a push to main. A release happens when a tag is pushed
# and not before, so the artifacts always correspond to a commit somebody
# deliberately named.
name: Release

on:
  push:
    tags:
      - "v*"       # the root module
      - "*/v*"     # a submodule, e.g. typesafecache/v1.0.0
      - "*/*/v*"   # a nested one, e.g. integrations/gin/v1.0.0

permissions:
  contents: read

jobs:
  # A tag is not a good place to discover that the tests fail. The full gate
  # runs first and the release job will not start unless it passes.
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Offline gate
        env:
          GOFLAGS: -mod=readonly
        run: make verify

      - name: Assert nothing unpublishable is being tagged
        run: |
          # Every submodule must point at a published version, not at a
          # development replace. Go ignores a replace in a dependency's
          # go.mod, so publishing one produces a module nobody can build.
          # A root tag is allowed to precede the re-pointing; a submodule tag
          # is not.
          case "${GITHUB_REF_NAME}" in
            */v*) python3 scripts/check_release_ready.py --version "${GITHUB_REF_NAME##*/}" --allow-dirty ;;
            *)    echo "root tag; submodules are re-pointed after this publishes" ;;
          esac

      - name: Assert the tag matches the module path
        run: |
          # A v2+ tag needs a /v2 suffix on the module path, and getting that
          # wrong produces a release nobody can `go get`. Catch it here rather
          # than in someone else's build.
          tag="${GITHUB_REF_NAME}"
          major="${tag%%.*}"        # v1 from v1.2.3
          module=$(go list -m)
          case "$major" in
            v0|v1)
              if [ "$module" != "github.com/nibir1/typesafe-go" ]; then
                echo "::error::$tag needs an unsuffixed module path, got $module"
                exit 1
              fi
              ;;
            *)
              if [ "$module" != "github.com/nibir1/typesafe-go/$major" ]; then
                echo "::error::$tag needs the module path to end in /$major, got $module"
                exit 1
              fi
              ;;
          esac
          echo "$tag matches module $module"

  vulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - "."
          - lint
          - typesafecache
          - typesafeotel
          - typesafeprom
          - integrations/nethttp
          - integrations/gin
          - integrations/echo
          - integrations/fiber
          - integrations/langchaingo
          - integrations/temporal
          - integrations/mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Binaries come from the root module only. A submodule tag publishes a Go
  # module and nothing else — there is no artifact to build, sign or attest.
  release:
    name: Build, sign and publish
    needs: [verify, vulncheck]
    if: ${{ !contains(github.ref_name, '/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # keyless signing and provenance, via OIDC
      attestations: write  # build provenance attestations
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # Verify the module cache against go.sum before anything is built.
      - name: Verify dependencies
        run: go mod verify

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft, for the SBOM
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keyless signing: no private key exists to be stolen. The
          # certificate records which workflow in which repository signed.
          COSIGN_EXPERIMENTAL: "1"

      # SLSA build provenance for every archive, verifiable with
      # `gh attestation verify <file> --repo nibir1/typesafe-go`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz,dist/*.zip

  # Submodules are tagged independently — typesafecache/v1.0.0 and so on — and
  # this proves each tag is fetchable from the proxy before anyone relies on
  # it. It runs only for a root tag, after the release, and does not fail it:
  # the proxy takes a little while to see a new tag.
  submodule-tags:
    name: Submodule tags are installable
    needs: release
    if: ${{ !contains(github.ref_name, '/') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Check each submodule tag
        run: |
          tag="${GITHUB_REF_NAME}"
          for m in typesafecache typesafeotel typesafeprom lint \
                   integrations/nethttp integrations/gin integrations/echo \
                   integrations/fiber integrations/langchaingo \
                   integrations/temporal integrations/mcp; do
            path="github.com/nibir1/typesafe-go/$m@$tag"
            if GOPROXY=https://proxy.golang.org go list -m "$path" > /dev/null 2>&1; then
              echo "ok   $path"
            else
              echo "::warning::$path is not on the proxy yet"
            fi
          done
