# The live-API suite, and cassette refresh.
#
# Gated on the TYPESAFE_API_KEY secret. A fork's pull request has no access to
# it, so this is deliberately not part of the required checks — a contributor
# without a key must still be able to get a green build. `make verify` is the
# gate; this is the corroboration.
name: Integration

on:
  schedule:
    # Daily. The contract is verified against the live API often enough that a
    # server-side change is noticed in a day rather than by a user.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      refresh_cassettes:
        description: Re-record every cassette and open a pull request
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live:
    name: Live API
    runs-on: ubuntu-latest
    # Skip cleanly rather than fail when the secret is absent — in a fork, on
    # a schedule that outlives a rotated key.
    if: github.repository == 'nibir1/typesafe-go'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Check the key is present
        id: key
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::warning::TYPESAFE_API_KEY is not set; the live suite is skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Live suite
        if: steps.key.outputs.present == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GOFLAGS: -mod=readonly
        run: make live

  # Re-records every cassette against the live API and opens a pull request if
  # any changed. Manual, never automatic: a cassette changing is information —
  # the model moved, or the contract did — and it should be read by a person,
  # not merged by a robot.
  refresh-cassettes:
    name: Refresh cassettes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.refresh_cassettes &&
      github.repository == 'nibir1/typesafe-go'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Re-record
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          make examples-record
          (cd internal/genexample && go test -count=1 -update ./...)
          (cd integrations/langchaingo && go test -count=1 -update ./...)

      - name: Assert no credential was recorded
        # The scan runs before anything is committed. A key in a cassette that
        # reaches a branch is a key that has to be rotated.
        run: make secrets

      - name: Replay the new cassettes
        run: |
          make examples
          go test -count=1 ./internal/genexample/
          (cd integrations/langchaingo && go test -count=1 ./...)

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No cassette changed."
            exit 0
          fi
          branch="cassettes/refresh-$(date -u +%Y%m%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Refresh cassettes against the live API

          Re-recorded by the Integration workflow. Every changed file is a
          real response from the live API; read the diff rather than merging
          on green, because a changed answer means the model or the contract
          moved."
          git push origin "$branch"
          gh pr create \
            --title "Refresh cassettes against the live API" \
            --body "Automated re-record. **Read the diff.** A changed probability means the model moved; a changed shape means the contract did." \
            --label cassettes
